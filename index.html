<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>推し駒battle | ホーム</title>
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <main class="home-shell" aria-label="推し駒battle ホームページ">
      <div class="board-backdrop" aria-hidden="true"></div>

      <header class="home-top">
        <a class="home-logo" href="index.html" aria-label="推し駒battle ホーム">
          <span class="piece-mark">推</span>
          <span>推し駒battle</span>
        </a>
        <a class="top-link" href="game.html">ゲームへ</a>
      </header>

      <section class="hero" aria-label="ゲーム紹介">
        <img class="hero-character hero-ren" src="assets/characters/ren-dog-rook.png" alt="蓮" />
        <img class="hero-character hero-yui" src="assets/characters/yui-cat-bishop.png" alt="結衣" />

        <div class="hero-copy">
          <p class="eyebrow">Cute Shogi Team Battle</p>
          <h1>推し駒battle</h1>
          <p class="lead">4人の推し駒を育てて、関係性ごと盤上へ。将棋みたいに読み合って、推しの一手で勝ちにいく。</p>
          <div class="hero-actions">
            <a class="primary-action" href="game.html">ゲームを始める</a>
            <a class="secondary-action" href="game.html">ゲーム画面を見る</a>
          </div>
        </div>
      </section>

      <section class="home-tabs" aria-label="紹介メニュー">
        <div class="tab-strip" role="tablist" aria-label="ホームタブ">
          <button id="gameTabButton" class="tab-btn active" type="button" role="tab" aria-selected="true" aria-controls="gameTab" data-home-tab="gameTab">ゲーム紹介</button>
          <button id="characterTabButton" class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="characterTab" data-home-tab="characterTab">キャラ紹介</button>
          <a class="tab-btn link-tab" href="https://donadonaa24-cyber.github.io/aniani-asobiba/" target="_blank" rel="noopener noreferrer">あにあにの遊び場</a>
        </div>

        <div id="gameTab" class="tab-panel active" role="tabpanel" aria-labelledby="gameTabButton">
          <article>
            <span class="mini-piece">育</span>
            <strong>4人チーム育成</strong>
            <p>会話、実戦、おでかけで20ターン育てる。</p>
          </article>
          <article>
            <span class="mini-piece">絆</span>
            <strong>関係性が動く</strong>
            <p>親密、嫉妬、感情でチームの空気が変わる。</p>
          </article>
          <article>
            <span class="mini-piece">戦</span>
            <strong>盤上バトル</strong>
            <p>保存したチームで出撃し、活躍ログを残す。</p>
          </article>
        </div>

        <div id="characterTab" class="tab-panel character-panel" role="tabpanel" aria-labelledby="characterTabButton" hidden>
          <article>
            <img src="assets/characters/ren-dog-rook.png" alt="蓮" />
            <div><strong>蓮</strong><p>まっすぐ走る犬の飛車。</p></div>
          </article>
          <article>
            <img src="assets/characters/yui-cat-bishop.png" alt="結衣" />
            <div><strong>結衣</strong><p>気分屋な猫の角行。</p></div>
          </article>
          <article>
            <img src="assets/characters/misuzu-dolphin-support.png" alt="海鈴" />
            <div><strong>海鈴</strong><p>空気を整えるイルカ支援役。</p></div>
          </article>
          <article>
            <img src="assets/characters/kouga-shark-striker.png" alt="鮫牙" />
            <div><strong>鮫牙</strong><p>強敵に噛みつくサメの強襲役。</p></div>
          </article>
        </div>
      </section>
    </main>
    <script src="home.js"></script>
  </body>
</html>
